<!DOCTYPE html>
<html lang="fa">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Video</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
}

main{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:16px;
}


/* VIDEO */

#video{
    width:100%;
    display:block;
    background:#000;
    border-radius:15px;
}


/* TITLE */

#title{
    margin-top:15px;
    font-size:21px;
    font-weight:bold;
}


/* DESCRIPTION */

#description{
    margin-top:8px;
    color:#aaa;
    font-size:15px;
    line-height:1.7;
}


/* INFO */

#info{
    display:flex;
    gap:18px;
    margin-top:14px;
    color:#999;
    font-size:14px;
}


/* EMPTY */

#empty{
    display:none;
    text-align:center;
    padding:80px 10px;
    color:#777;
}


/* ERROR */

#error{
    display:none;
    padding:20px;
    color:#ff7777;
    text-align:center;
}

</style>

</head>


<body>

<main>

    <video
        id="video"
        controls
        playsinline
        preload="metadata"
    ></video>


    <div id="title"></div>

    <div id="description"></div>


    <div id="info">

        <div>
            👁 <span id="views">0</span> بازدید
        </div>

        <div>
            📅 <span id="date">-</span>
        </div>

    </div>


    <div id="empty">
        هنوز فیلمی قرار داده نشده است.
    </div>


    <div id="error"></div>

</main>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://ihbsxjgzrhnssluqooqh.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_hHyHJI5JkxgLNrXAwZrGWQ_vbD3kdrj";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   DEVICE ID
===================================================== */

function getDeviceId(){

    let deviceId =
        localStorage.getItem(
            "video_device_id"
        );


    if(!deviceId){

        deviceId =
            crypto.randomUUID();

        localStorage.setItem(
            "video_device_id",
            deviceId
        );
    }


    return deviceId;
}


/* =====================================================
   LOAD VIDEO
===================================================== */

async function loadVideo(){

    const result =
        await supabase
        .from("videos")
        .select(
            "id,video_url,title,description,uploaded_at"
        )
        .eq(
            "id",
            1
        )
        .maybeSingle();


    if(result.error){

        showError(
            result.error.message
        );

        return;
    }


    if(!result.data){

        document
        .getElementById("video")
        .style.display =
            "none";

        document
        .getElementById("empty")
        .style.display =
            "block";

        return;
    }


    const data =
        result.data;


    /* فیلم */

    const video =
        document.getElementById(
            "video"
        );

    video.src =
        data.video_url;


    /* عنوان */

    document
    .getElementById("title")
    .textContent =
        data.title || "Video";


    /* توضیحات */

    document
    .getElementById("description")
    .textContent =
        data.description || "";


    /* تاریخ */

    if(data.uploaded_at){

        const date =
            new Date(
                data.uploaded_at
            );

        document
        .getElementById("date")
        .textContent =
            date.toLocaleDateString(
                "fa-IR"
            );
    }


    /* ثبت بازدید */

    await registerView(
        data.id
    );


    /* تعداد بازدید */

    await loadViews(
        data.id
    );

}


/* =====================================================
   REGISTER VIEW
===================================================== */

async function registerView(
    videoId
){

    const deviceId =
        getDeviceId();


    const result =
        await supabase
        .from("video_views")
        .insert({

            video_id:
                videoId,

            device_id:
                deviceId

        });


    /*
       اگر قبلاً این دستگاه
       بازدید کرده باشد،
       Unique Constraint مانع
       ثبت مجدد می‌شود.
    */

    if(result.error){

        console.log(
            "View already exists."
        );
    }

}


/* =====================================================
   LOAD VIEW COUNT
===================================================== */

async function loadViews(
    videoId
){

    const result =
        await supabase
        .from("video_views")
        .select(
            "id",
            {
                count:"exact",
                head:true
            }
        )
        .eq(
            "video_id",
            videoId
        );


    if(result.error){

        console.error(
            result.error
        );

        return;
    }


    document
    .getElementById("views")
    .textContent =
        result.count || 0;

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
){

    const error =
        document.getElementById(
            "error"
        );


    error.style.display =
        "block";


    error.textContent =
        "خطا: " + message;

}


/* =====================================================
   START
===================================================== */

loadVideo();

</script>

</body>

</html>
