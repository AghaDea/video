<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Checking</title>
</head>
<body>

<script>
const ALLOWED_COUNTRIES = [
    "iran",
];

async function getCountry() {

    const services = [
        "https://ipwho.is/",
        "https://ipapi.co/json/",
        "https://ipinfo.io/json"
    ];

    for (const url of services) {
        try {
            const response = await fetch(url + "?t=" + Date.now(), {
                cache: "no-store"
            });

            if (!response.ok) continue;

            const data = await response.json();

            const country =
                data.country ||
                data.country_name ||
                "";

            if (country) {
                return country.trim().toLowerCase();
            }

        } catch (error) {
            // سرویس بعدی امتحان می‌شود
        }
    }

    return null;
}

(async function () {

    const country = await getCountry();

    if (!country) {
        document.body.textContent = "ERROR: Could not detect country";
        return;
    }

    const allowed = ALLOWED_COUNTRIES.some(
        c => c.toLowerCase() === country
    );

    if (allowed) {
        window.location.replace("/video/home");
    } else {
        document.body.textContent = "This service is not available in your region.";
    }

})();
</script>

</body>
</html>
