<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video</title>

<style>
html,body{
    margin:0;
    padding:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

main{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
    box-sizing:border-box;
}

video{
    width:100%;
    display:block;
    background:#000;
    border-radius:14px;
}

#title{
    margin-top:14px;
    font-size:20px;
    font-weight:bold;
}

#info{
    margin-top:8px;
    color:#aaa;
    font-size:14px;
}
</style>
</head>

<body>

<main>

    <video
        id="video"
        controls
        playsinline
        preload="metadata"
    ></video>

    <div id="title">
        فیلم من
    </div>

    <div id="info">
        ویدیو
    </div>

</main>

<script>

/* =====================================
   فقط اینجا لینک فیلم را قرار بده
===================================== */

const VIDEO_URL =
    "https://ihbsxjgzrhnssluqooqh.supabase.co/storage/v1/object/public/videos/76f21a1a675395424d04dc0afe588dbf.mp4";


/* =====================================
   مشخصات فیلم
===================================== */

const VIDEO_TITLE =
    "فیلم من";

const VIDEO_INFO =
    "توضیحات فیلم";


/* =====================================
   نمایش فیلم
===================================== */

const video =
    document.getElementById("video");

video.src =
    VIDEO_URL;


/* =====================================
   عنوان
===================================== */

document.getElementById("title")
    .textContent =
    VIDEO_TITLE;


/* =====================================
   توضیحات
===================================== */

document.getElementById("info")
    .textContent =
    VIDEO_INFO;

</script>

</body>
</html>
